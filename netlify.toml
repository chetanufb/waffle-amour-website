# Netlify settings for the Waffle Amour website.
# The finished site is generated into public/ by tools/build.py and committed,
# so Netlify only has to publish that folder (no build step).
[build]
  publish = "public"
  command = ""

# Old addresses from before the single-site structure -> their new home
[[redirects]]
  from = "/dark/recipes.html"
  to = "/recipes/"
  status = 301
[[redirects]]
  from = "/light/recipes.html"
  to = "/recipes/"
  status = 301
[[redirects]]
  from = "/recipes.html"
  to = "/recipes/"
  status = 301
[[redirects]]
  from = "/dark/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/light/*"
  to = "/"
  status = 301

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
