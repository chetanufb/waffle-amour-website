# Netlify settings for the Waffle Amour website.
# Plain static site: nothing to build, publish the repository as-is.
[build]
  publish = "."
  command = ""

# Visitors land on the finished site (dark by default; the header toggle
# switches to light and remembers the choice). "force = true" makes these
# apply even though the source pages exist at the same paths.
[[redirects]]
  from = "/"
  to = "/dark/"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "/dark/"
  status = 301
  force = true

[[redirects]]
  from = "/recipes.html"
  to = "/dark/recipes.html"
  status = 301
  force = true

# Build tools and repository notes are not part of the public site.
[[redirects]]
  from = "/tools/*"
  to = "/dark/"
  status = 302
  force = true

[[redirects]]
  from = "/README.md"
  to = "/dark/"
  status = 302
  force = true

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
